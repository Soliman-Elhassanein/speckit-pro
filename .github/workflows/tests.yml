name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regression tests of the baseline check
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n scripts/build-template.sh
          sh -n preset/apply-converge.sh
      - name: YAML parses
        run: |
          pip install --quiet pyyaml
          python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" extension/extension.yml preset/preset.yml workflow/workflow.yml extension/ci/baseline.yml
      - name: template/ matches its sources
        run: |
          diff -r extension template/.specify/extensions/baseline
          diff -r preset/commands template/.specify/presets/universal-profile/commands
          diff -r preset/templates template/.specify/presets/universal-profile/templates
          diff workflow/workflow.yml template/.specify/workflows/speckit-pro/workflow.yml
