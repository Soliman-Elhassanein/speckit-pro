installed:
- baseline
settings:
  auto_execute_hooks: true
hooks:
  before_specify:
  - extension: baseline
    command: speckit.baseline.context
    enabled: true
    optional: false
    priority: 1
    prompt: Execute speckit.baseline.context?
    description: Choose the path for this request and load the product baseline
    condition: null
  after_specify:
  - extension: baseline
    command: speckit.baseline.check
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.baseline.check?
    description: Record the spec as owner of its capability and pin the entries it
      cites
    condition: null
  before_plan:
  - extension: baseline
    command: speckit.baseline.context
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.baseline.context?
    description: Load the architecture baseline and decisions
    condition: null
  after_plan:
  - extension: baseline
    command: speckit.baseline.check
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.baseline.check?
    description: Pin the stack, the parts and the entries the new plan cites
    condition: null
  before_analyze:
  - extension: baseline
    command: speckit.baseline.check
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.baseline.check?
    description: Check the baseline before the spec, plan and tasks are analyzed against
      it
    condition: null
  before_implement:
  - extension: baseline
    command: speckit.baseline.check
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.baseline.check?
    description: Stop implementation while the baseline check fails
    condition: null
  before_converge:
  - extension: baseline
    command: speckit.baseline.review
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.baseline.review?
    description: Review the finished code against the architecture rules and boundaries
    condition: null
  after_implement:
  - extension: baseline
    command: speckit.baseline.check
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.baseline.check?
    description: Recalculate delivery from the finished record and record the synced
      point of this feature's parts
    condition: null
  after_converge:
  - extension: baseline
    command: speckit.baseline.check
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.baseline.check?
    description: Recalculate delivery status from verification evidence
    condition: null
