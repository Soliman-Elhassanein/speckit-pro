# Copy into the project and configure its runtime before the check when rules need it.
# This YAML cannot configure GitHub branch protection: require this job in repository settings.
name: baseline
on:
  push:
  pull_request:
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Add the project's locked dependency/service setup here when rule checks require it.
      - name: Required baseline gate (global, read-only)
        env:
          BASELINE_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASELINE_PR_BASE" ]; then
            python3 .specify/extensions/baseline/scripts/baseline_check.py --gate --strict --base "$BASELINE_PR_BASE"
          else
            python3 .specify/extensions/baseline/scripts/baseline_check.py --gate --strict
          fi
