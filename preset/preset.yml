schema_version: "1.0"

preset:
  id: "universal-profile"
  name: "Universal Profile"
  version: "4.0.0"
  description: "Feature rules on upstream commands and templates: Focus, Delivery gates, completion records and memory write-back"
  author: "Soliman-Elhassanein"

requires:
  # Target 1.2.2; real composition is checked by scripts/check-install.sh.
  speckit_version: ">=1.2.2"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      strategy: "wrap"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      strategy: "append"
    - type: "template"
      name: "verification-template"
      file: "templates/verification-template.md"

tags:
  - "verification"
  - "converge"
  - "governance"
