schema_version: "1.0"

preset:
  id: "universal-profile"
  name: "Universal Profile"
  version: "3.0.0"
  description: "The Spec Kit Universal Adoption and Execution Profile as operative commands and templates: stable IDs, a verification matrix, verification evidence, and evidence-aware converge"
  author: "Soliman-Elhassanein"

requires:
  # Verified on specify-cli 1.1.2; needs the stock commands and the wrap and append strategies.
  speckit_version: ">=1.1.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Specify with stable AS and TR identities and a verification matrix"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Clarify in rounds until every material point is resolved or deferred"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan with a reuse inventory, a verification plan, exact gates, and a NOT RUN verification record"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Tasks with mandatory tests, traceable verification work, and a closing verification phase"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Analyze coverage by FR, AS, TR and task, and check the spec and plan against the project baseline"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement test-first, then verify on the final state and record the evidence"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Converge on current evidence with three outcomes and append-only remediation"
      strategy: "wrap"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Adds the verification matrix and the completion gate to the spec"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Adds the reuse inventory, the verification plan and the quality gates to the plan"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Adds the closing verification and convergence phase to the tasks"
      strategy: "append"
    - type: "template"
      name: "verification-template"
      file: "templates/verification-template.md"
      description: "The verification record of section 7.3 of the profile"

tags:
  - "verification"
  - "converge"
  - "governance"
