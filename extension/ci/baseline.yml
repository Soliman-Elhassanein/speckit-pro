# Copy into a project to check memory structure and feature citations.
name: baseline
on:
  push:
  pull_request:
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Memory structure and citations
        run: python3 .specify/extensions/baseline/scripts/baseline_check.py
