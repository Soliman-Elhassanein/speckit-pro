schema_version: "1.0"

extension:
  id: baseline
  name: "Project Baseline"
  version: "4.0.0"
  description: "Project memory beside the constitution: product.md (what), architecture.md (how), decisions.md (why). Read before specify and plan, changed only with approval, and checked by a script."
  category: "process"
  effect: "read-write"
  author: "Soliman-Elhassanein"

requires:
  # Target: specify-cli 1.2.2.
  speckit_version: ">=1.2.2"

provides:
  commands:
    - name: speckit.baseline.branch
      file: commands/speckit.baseline.branch.md
      description: "Apply branch type and ticket naming after upstream branch creation"
    - name: speckit.baseline.amend
      file: commands/speckit.baseline.amend.md
      description: "Create or amend product.md, architecture.md and decisions.md, each change approved by the user first"
    - name: speckit.baseline.context
      file: commands/speckit.baseline.context.md
      description: "Before specify or plan: pick the path for the request, load the relevant baseline entries, and put conflicts to the user"
    - name: speckit.baseline.check
      file: commands/speckit.baseline.check.md
      description: "Validate memory structure and citations"
    - name: speckit.baseline.recover
      file: commands/speckit.baseline.recover.md
      description: "Propose a first baseline or amendments for code changed outside the process"

hooks:
  after_specify:
    priority: 1
    command: speckit.baseline.branch
    optional: false
    description: "Apply approved type and ticket id to the upstream-created branch"
  before_specify:
    priority: 1
    command: speckit.baseline.context
    optional: false
    description: "Choose full or light path, load product memory and resolve the focus verdict"
  before_plan:
    priority: 1
    command: speckit.baseline.context
    optional: false
    description: "Load architecture, Delivery standards and decisions with rejected options"
  after_plan:
    command: speckit.baseline.check
    optional: false
    description: "Validate the new plan citations"
  before_analyze:
    command: speckit.baseline.check
    optional: false
    description: "Check the baseline before the spec, plan and tasks are analyzed against it"
  before_implement:
    command: speckit.baseline.check
    optional: false
    description: "Stop implementation while the baseline check fails"
  after_implement:
    command: speckit.baseline.check
    optional: false
    description: "Validate memory and feature citations"
  after_converge:
    command: speckit.baseline.check
    optional: false
    description: "Validate memory and feature citations"

tags:
  - "baseline"
  - "product"
  - "architecture"
  - "decisions"
  - "governance"
